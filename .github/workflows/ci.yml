name: CBRN simulation software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: node cli.mjs init examples/study.json /tmp/cbrn-record.json
      - run: node cli.mjs verify /tmp/cbrn-record.json
      - run: node cli.mjs report /tmp/cbrn-record.json /tmp/cbrn-report.json
      - run: node cli.mjs csv /tmp/cbrn-record.json /tmp/cbrn-cases.csv
      - uses: actions/upload-artifact@v4
        with:
          name: cbrn-research-node-${{ matrix.node }}
          path: dist/
